name: Security scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # SAST for Python and C/C++ (drivers in hw_exps). build-mode "none" means
  # no Bazel/CFU build is needed; results land in Security > Code scanning.
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, c-cpp, actions]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  # Python-specific SAST. Reports to Code scanning instead of failing the build,
  # since research code trips many low-signal rules.
  bandit:
    name: Bandit (Python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "bandit[sarif]"
      # B311: `random` used for experiments, not crypto.
      - run: bandit -r . --severity-level medium --skip B311 -f sarif -o bandit.sarif --exit-zero
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit.sarif
          category: bandit

  # Leaked tokens/keys anywhere in git history. Fails on verified secrets.
  secrets:
    name: Secret scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

  # The repo ships .pkl / .pth / .th files; loading a malicious pickle runs
  # arbitrary code. Fails if any file imports dangerous globals.
  pickle-scan:
    name: Pickle / model file scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true # .pth/.th are stored in Git LFS
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install picklescan
      - run: picklescan --path .

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          git ls-files -z '*.sh' | xargs -0 --no-run-if-empty \
            shellcheck --shell=bash --severity=error --format=gcc
